name: lanspeech
description: "LanSpeech Authentication and Onboarding Module."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  record: ^7.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: web/lan_speech_app_icon.png
  web:
    generate: true
    image_path: web/lan_speech_app_icon.png
    background_color: "#061F29"
    theme_color: "#061F29"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - config/.env
    - assets/curriculum/lanspeech_curriculum.json